  :root {
    --bg: #09080d;
    --grid: rgba(244, 242, 250, 0.035);
    --text: #f4f2fa;
    --muted: #aebbcc;
    --accent: #8b6cff;
    --accent-strong: #a68fff;
    --glow: rgba(139, 108, 255, 0.28);
    --success: #34d399;
    /* One unit that scales with the image: 1200x630 and 1280x720 lay out the same. */
    --u: min(1vw, 1.9vh);
  }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 40% 55% at 85% 105%, rgba(52, 211, 153, 0.06), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / calc(var(--u) * 4) calc(var(--u) * 4),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / calc(var(--u) * 4) calc(var(--u) * 4),
      var(--bg);
    font-family: "Inter", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--u) * 7);
  }
  .mark {
    position: relative;
    width: calc(var(--u) * 22);
    flex: none;
  }
  .mark::before {
    content: "";
    position: absolute;
    inset: -45%;
    background: radial-gradient(circle, var(--glow), transparent 62%);
  }
  .mark svg { position: relative; display: block; width: 100%; height: auto; }
  .words { display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); max-width: calc(var(--u) * 58); }
  .name { font-size: calc(var(--u) * 7.4); font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .name span { color: var(--accent-strong); }
  h1 { margin: 0; font-size: calc(var(--u) * 5.4); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; }
  .also { font-size: calc(var(--u) * 2.1); font-weight: 500; color: var(--muted); line-height: 1.35; }
  .promise { display: flex; align-items: center; gap: calc(var(--u) * 1.2); margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 2.9); font-weight: 600; color: var(--success); }
  .promise svg { width: calc(var(--u) * 2.6); height: auto; flex: none; }
</style>
