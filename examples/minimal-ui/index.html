<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal any2orca converter</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.5; }
      body { max-width: 40rem; margin: 2.5rem auto; padding: 0 1rem; }
      label.drop { display: block; padding: 2rem 1rem; text-align: center; border: 2px dashed currentColor; border-radius: 0.6rem; cursor: pointer; }
      label.drop:focus-within, label.drop.over { outline: 3px solid Highlight; outline-offset: 2px; }
      input[type="file"] { position: absolute; opacity: 0; width: 1px; height: 1px; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 1rem 0; }
      dt { opacity: 0.7; }
      dd { margin: 0; }
      select, button { font: inherit; padding: 0.5rem 0.9rem; border-radius: 0.4rem; border: 1px solid currentColor; background: none; color: inherit; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: progress; }
      .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
      #status { min-height: 1.5em; }
      #status.error { color: #c0392b; }
      @media (prefers-color-scheme: dark) { #status.error { color: #ff7b6b; } }
    </style>
  </head>
  <body>
    <h1>Convert a 3MF to Snapmaker U1</h1>

    <label class="drop" id="drop">
      <span>Drop a .3mf here, or choose one</span>
      <input id="file" type="file" accept=".3mf" />
    </label>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="project" hidden>
      <h2>Your project</h2>
      <dl id="facts"></dl>
      <div class="row">
        <label for="profile">Profile</label>
        <select id="profile"></select>
        <button id="convert" type="button">Convert</button>
      </div>
    </section>

    <section id="result" hidden>
      <h2>Converted</h2>
      <p><a id="download">Download</a></p>
      <ul id="notes"></ul>
    </section>

    <p>The conversion runs in a Web Worker in this page. Your file is never uploaded.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
