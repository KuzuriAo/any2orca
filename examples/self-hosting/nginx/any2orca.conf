# SPDX-License-Identifier: MIT
# The any2orca web app on nginx: a server block to include from the http block.
# Unpack a release (or apps/web/dist from a build) into the root below, then
# `nginx -t && nginx -s reload`. Tested with nginx 1.31.
server {
    listen 80;
    server_name any2orca.example.com;
    root /var/www/any2orca;
    index index.html;

    # The policy the app is tested against: it converts a file with no
    # violations (see docs/run-the-web-app.md). Keep these headers at this
    # level: an add_header inside a location would drop all of them there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Once the site is served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Optional: hide sections without touching the files (names: beyond, faq,
    # integrate, support). The source link is never hidden.
    # sub_filter '<html lang="en"' '<html lang="en" data-hide="beyond,faq"';
    # sub_filter_once on;

    # Built scripts and styles have a content hash in their name, so they can
    # be cached for a year. `expires` sets Cache-Control without add_header,
    # so the headers above still apply.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else (the page, the profile catalog, fonts) is checked with
    # the server on every visit, so an update shows up at once. Unknown paths
    # get a real 404; the app needs no rewrite rules.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
