# The any2orca web app on Apache 2.4: a virtual host. Needs mod_headers (and,
# to hide sections, mod_substitute and mod_filter). Unpack a release (or
# apps/web/dist from a build) into the DocumentRoot below, then
# `apachectl configtest && apachectl graceful`. Tested with Apache 2.4.
<VirtualHost *:80>
    ServerName any2orca.example.com
    DocumentRoot "/var/www/any2orca"
    DirectoryIndex index.html

    <Directory "/var/www/any2orca">
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>

    # The policy the app is tested against: it converts a file with no
    # violations (see docs/run-the-web-app.md).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    # Once the site is served over HTTPS:
    # Header always set Strict-Transport-Security "max-age=31536000"

    # The page, the profile catalog and fonts are checked with the server on
    # every visit, so an update shows up at once. Built scripts and styles
    # have a content hash in their name, so they can be cached for a year.
    Header set Cache-Control "no-cache"
    <Directory "/var/www/any2orca/assets">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Optional: hide sections without touching the files (names: beyond, faq,
    # integrate, support). The source link is never hidden.
    # AddOutputFilterByType SUBSTITUTE text/html
    # Substitute "s|<html lang=\"en\"|<html lang=\"en\" data-hide=\"beyond,faq\"|"
</VirtualHost>
