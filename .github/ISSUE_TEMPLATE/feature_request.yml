name: Feature request
description: Something any2orca should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then any idea for a solution.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where would it live?
      options: [Web app, CLI, Library, Profile data, Not sure]
