name: Bug report
description: A conversion went wrong, or the app or CLI misbehaved.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't attach a file you aren't comfortable sharing.** The problem report below is usually enough, and I can ask for a file if needed. If you do attach a project, zip it first: GitHub doesn't take `.3mf` files.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: |
        Paste the report here. In the web app, click **Copy report** on the result or on the error. On the command line, add `--report` to the command and copy what it prints between the two marker lines.

        It is text only: versions, where it ran, what the project is (slicer, printer, filament and plate counts), the options, the result or the error's code, and the notes. It holds no file name, object names or paths. Read it before you paste it.

        Can't get one (an older version, or the page doesn't load)? Say instead where it happened (web app, CLI or library), the version, and the source slicer and printer.
      render: text
  - type: input
    id: snorca
    attributes:
      label: Snapmaker Orca version you opened the result in
      description: Leave empty if you didn't get that far.
