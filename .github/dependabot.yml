version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major versions of these change what the packages ship or support, so they
      # are done on purpose, not by a bot:
      #  - zod: the library exports zod schemas (OutputStampSchema, StatsEventSchema)
      #  - vitest 5 drops Node 20, which the package still supports
      #  - typescript and @types/node: moved deliberately, with the Node versions CI tests
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
