# Publishes one package when its release tag is pushed:
#   any2orca@<version>           -> packages/core
#   any2orca-profiles@<version>  -> packages/profiles
# Tags come from `npx changeset tag` after `npx changeset version` (see
# CONTRIBUTING.md). Uses npm trusted publishing (OIDC): no npm token is
# stored anywhere. After a successful publish it creates the GitHub Release
# for the tag, with the matching CHANGELOG.md section as its notes, and for
# the core package attaches the prebuilt web app (the default oss skin) as a
# tarball for self-hosting, with a SHA256SUMS file to check it against. Both
# files get a GitHub build-provenance attestation, so anyone can check they
# were built by this workflow from this repo (`gh attestation verify`).
name: Publish
on:
  push:
    tags:
      - "any2orca@*"
      - "any2orca-profiles@*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only a tag on main publishes; a tag pushed from any other branch stops here.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Pinned, so a new npm
      # release can't change how a release is published without a commit here.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the package version
        run: |
          PKG="${GITHUB_REF_NAME%@*}"
          VERSION="${GITHUB_REF_NAME##*@}"
          ACTUAL="$(node -p "require('./' + (process.argv[1] === 'any2orca' ? 'packages/core' : 'packages/profiles') + '/package.json').version" "$PKG")"
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "Tag says $PKG@$VERSION but package.json says $ACTUAL"; exit 1
          fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG_DIR=$([ "$PKG" = any2orca ] && echo packages/core || echo packages/profiles)" >> "$GITHUB_ENV"
      # Before publishing, so a version with no changelog entry fails here and
      # nothing reaches npm without notes.
      - name: Extract the release notes
        run: node scripts/release-notes.mjs "$PKG_DIR/CHANGELOG.md" "$VERSION" > release-notes.md
      # The core pins an exact profiles version; it must already be on npm, or installing the core fails.
      - name: Check the pinned profiles version is published
        if: env.PKG == 'any2orca'
        run: |
          DEP="$(node -p "require('./packages/core/package.json').dependencies['any2orca-profiles']")"
          npm view "any2orca-profiles@$DEP" version >/dev/null || { echo "any2orca-profiles@$DEP is not on npm yet; publish it first"; exit 1; }
      - run: npm publish -w "$PKG" --access public
      - name: Package the web app for self-hosting
        if: env.PKG == 'any2orca'
        run: |
          tar -czf "any2orca-web-$VERSION.tgz" -C apps/web/dist .
          sha256sum "any2orca-web-$VERSION.tgz" > SHA256SUMS
      - name: Attest the release files
        if: env.PKG == 'any2orca'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            any2orca-web-${{ env.VERSION }}.tgz
            SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          if [ "$PKG" = any2orca ]; then
            gh release create "$GITHUB_REF_NAME" $FLAGS --title "$PKG $VERSION" --notes-file release-notes.md "any2orca-web-$VERSION.tgz" SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" $FLAGS --title "$PKG $VERSION" --notes-file release-notes.md
          fi
