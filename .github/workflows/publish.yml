# Releases on push to main: any package whose version in its package.json
# isn't on npm yet is published, tagged (<name>@<version>) and given a
# GitHub Release with its CHANGELOG.md section as notes. A push that bumps no
# version releases nothing. scripts/release-plan.mjs decides what to release,
# and refuses a version with no changelog section, or a core pinning a
# profiles version that isn't on npm or in the same release. Profiles go
# first, since the core pins an exact profiles version. Versions come from
# `npx changeset version` (see CONTRIBUTING.md).
#
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. The core
# release attaches the prebuilt web app (the default oss skin) as a tarball for
# self-hosting, with a SHA256SUMS file to check it against; both get a GitHub
# build-provenance attestation (`gh attestation verify`).
#
# "Run workflow" re-runs it by hand: as a dry run (the default) on any branch,
# which checks and builds everything and runs `npm publish --dry-run`; or for
# real on main, to finish a release that failed partway (it only publishes
# what npm doesn't have yet).
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check and build everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      profiles_version: ${{ steps.plan.outputs.profiles_version }}
      core_version: ${{ steps.plan.outputs.core_version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        run: node scripts/release-plan.mjs

  publish:
    needs: plan
    if: needs.plan.outputs.publish != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PROFILES_VERSION: ${{ needs.plan.outputs.profiles_version }}
      CORE_VERSION: ${{ needs.plan.outputs.core_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only main publishes; a dry run may run on any branch.
      - name: Check the commit is on main
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Pinned, so a new npm
      # release can't change how a release is published without a commit here.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Planned again on the built tree, with the notes written out: the same
      # checks, right before anything is published.
      - name: Check the plan and write the release notes
        run: node scripts/release-plan.mjs --notes-dir release-notes

      - name: Publish any2orca-profiles
        if: env.PROFILES_VERSION != ''
        run: |
          if [ "$DRY_RUN" = true ]; then npm publish -w any2orca-profiles --access public --dry-run; else npm publish -w any2orca-profiles --access public; fi
      - name: Release any2orca-profiles
        if: env.PROFILES_VERSION != '' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="any2orca-profiles@$PROFILES_VERSION"
          FLAGS=""
          case "$PROFILES_VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" $FLAGS --title "any2orca-profiles $PROFILES_VERSION" --notes-file release-notes/any2orca-profiles.md

      - name: Publish any2orca
        if: env.CORE_VERSION != ''
        run: |
          if [ "$DRY_RUN" = true ]; then npm publish -w any2orca --access public --dry-run; else npm publish -w any2orca --access public; fi
      - name: Package the web app for self-hosting
        if: env.CORE_VERSION != ''
        run: |
          tar -czf "any2orca-web-$CORE_VERSION.tgz" -C apps/web/dist .
          sha256sum "any2orca-web-$CORE_VERSION.tgz" > SHA256SUMS
      - name: Attest the release files
        if: env.CORE_VERSION != '' && env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            any2orca-web-${{ env.CORE_VERSION }}.tgz
            SHA256SUMS
      - name: Release any2orca
        if: env.CORE_VERSION != '' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="any2orca@$CORE_VERSION"
          FLAGS=""
          case "$CORE_VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" $FLAGS --title "any2orca $CORE_VERSION" --notes-file release-notes/any2orca.md "any2orca-web-$CORE_VERSION.tgz" SHA256SUMS

      - name: Summary
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          if [ "$DRY_RUN" = true ]; then echo "Dry run: would release $PUBLISH. Nothing was published."; else echo "Released $PUBLISH."; fi
